name: DevOps Fullstack Build & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # needed to push docker image to GHCR

    steps:
    #
    # 1. Checkout code
    #
    - name: Checkout repository
      uses: actions/checkout@v4

    #
    # 2. Log in to GitHub Container Registry
    #
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    #
    # 3. Build Docker image
    #
    - name: Build Docker image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/devops:latest .

    #
    # 4. Push to GHCR
    #
    - name: Push image
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/devops:latest

  #
  # 5. Deploy job (optional)
  #
  deploy:
    needs: build
    runs-on: ubuntu-latest  # or self-hosted server for real deploy

    if: github.ref == 'refs/heads/main'

    steps:
    - name: Connect to server via SSH & deploy
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          docker pull ghcr.io/${{ github.repository_owner }}/devops:latest
          docker stop devops || true
          docker rm devops || true
          docker run -d \
            --name devops \
            -p 3000:3000 \
            --env-file /home/${{ secrets.SERVER_USER }}/devops.env \
            ghcr.io/${{ github.repository_owner }}/devops:latest
